services:
  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fpg-nginx
    restart: always
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - fpg-network

  # Tor SOCKS5 Proxy (outbound IP rotation for RPC calls)
  tor:
    build: ./tor
    container_name: fpg-tor
    restart: always
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
    networks:
      - fpg-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s


  # Redis Cache (internal + localhost:6381)
  redis:
    image: redis:7-alpine
    container_name: fpg-redis
    restart: always
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - fpg_redis_data:/data
    networks:
      - fpg-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API (internal + localhost:3002)
  backend:
    build: .
    container_name: fpg-backend
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=pgbouncer
      - DB_NAME=${DB_NAME:-fortune_protocol_g}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2h}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BSC_RPC_URL=${BSC_RPC_URL:-https://bsc-dataseed1.binance.org/}
      - BSC_RPC_URLS=${BSC_RPC_URLS:-https://bsc-dataseed1.binance.org/,https://bsc-dataseed2.binance.org/}
      - BSC_TESTNET_RPC_URL=${BSC_TESTNET_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545/}
      - BSC_CHAIN_ID=${BSC_CHAIN_ID:-56}
      - USDT_TOKEN_ADDRESS=${USDT_TOKEN_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      - BALANCE_FETCHER_ADDRESS=${BALANCE_FETCHER_ADDRESS}
      - MINE_CONTRACT_ADDRESS=${MINE_CONTRACT_ADDRESS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TOR_PROXY=socks5h://tor:9050
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      tor:
        condition: service_healthy
    networks:
      - fpg-network

  # PgBouncer Connection Pooler (internal + localhost:6434)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: fpg-pgbouncer
    restart: always
    ports:
      - "127.0.0.1:6434:5432"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASS}@postgres:5432/${DB_NAME:-fortune_protocol_g}
      - POOL_MODE=session
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=25
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=${DB_USER:-postgres}
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options,application_name
      - VERBOSE=1
      - REVERSE_DNS=0
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fpg-network

  # PostgreSQL Database (internal + localhost:5434)
  postgres:
    image: postgres:15-alpine
    container_name: fpg-postgres
    restart: always
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-fortune_protocol_g}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - fpg_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fpg-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  fpg-network:
    driver: bridge

volumes:
  fpg_postgres_data:
  fpg_redis_data:
